name: Verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portfolio_test
          POSTGRES_PASSWORD: test-only-not-a-secret
          POSTGRES_DB: portfolio_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U portfolio_test" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://portfolio_test:test-only-not-a-secret@localhost:5432/portfolio_test
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.13'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: npm ci && node codegen.mjs && npm run build
        working-directory: web
      - run: git diff --exit-code -- openapi.json web/src/generated.ts
      - run: npx playwright install --with-deps chromium firefox webkit && npm test
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - run: uv run pip-audit
      - run: python tools/security_scan.py
      - run: docker build -t portfolio-artwork-ci .
