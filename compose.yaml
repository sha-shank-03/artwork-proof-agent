services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: artwork
      POSTGRES_DB: artwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes: [artwork-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U artwork"]
      interval: 5s
      retries: 10
  api:
    build: .
    ports: ["127.0.0.1:8081:8081"]
    environment:
      DATABASE_URL: postgresql://artwork:${POSTGRES_PASSWORD:-local-development-only}@db:5432/artwork
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-5.6-luna
      LIVE_ENABLED: ${LIVE_ENABLED:-false}
      ALLOWED_ORIGIN: http://localhost:5174
    depends_on:
      db: {condition: service_healthy}
volumes:
  artwork-data:
